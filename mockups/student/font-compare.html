<title>TPT Font Compare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Figtree:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&family=Atkinson+Hyperlegible:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Outfit:wght@300;400;500;600&family=Manrope:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Source+Sans+3:wght@400;600&family=Work+Sans:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Three phones, same calm Notifications screen; only the font family (and Lexend's weight) changes. */
:root{--page:#f4f6f4;--phone:#fdfdfb;--ink:#18181b;--text:#52525b;--muted:#71717a;--line:#e3e8e4;--brand:#0e7a3c;--top:#0b4d2c;--gold:#f2c230;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0d0f0e;--phone:#151817;--ink:#f4f4f5;--text:#c8c8cc;--muted:#a1a1aa;--line:#2a2f2c;--brand:#5ccf8f;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0d0f0e;--phone:#151817;--ink:#f4f4f5;--text:#c8c8cc;--muted:#a1a1aa;--line:#2a2f2c;--brand:#5ccf8f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{max-width:720px;margin:0 auto 20px}
h1{font-size:24px;margin:0;text-wrap:balance}
header p{color:var(--muted);margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
figure{margin:0;width:340px;max-width:100%}
figcaption{font-size:14px;margin-bottom:8px}
figcaption b{display:block;font-size:15px}
figcaption span{color:var(--muted)}
.phone{background:var(--phone);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.seal{width:34px;height:34px;border-radius:50%;background:var(--gold);border:3px solid var(--top)}
.bar b{display:block;font-size:16px;font-weight:600}
.bar small{display:block;font-size:12px;color:var(--muted)}
.body{padding:8px 20px 24px}
.back{font-size:13px;color:var(--muted)}
h2{font-size:26px;font-weight:600;margin:6px 0 14px;letter-spacing:-.01em}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.dot.on{background:var(--brand)}
.t{display:block;font-size:15px;line-height:1.35;color:var(--ink)}
.t.new{font-weight:600}.t.old{font-weight:500}
.b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.6;color:var(--text);margin-top:4px}
.at{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.lexend{font-family:"Lexend",system-ui,sans-serif}
.lexend-light{font-family:"Lexend",system-ui,sans-serif}
.lexend-light .t.new{font-weight:500}.lexend-light .t.old{font-weight:400}.lexend-light .b{font-weight:300}.lexend-light h2{font-weight:500}
.figtree{font-family:"Figtree",system-ui,sans-serif}
.nunito{font-family:"Nunito Sans",system-ui,sans-serif}
.atkinson{font-family:"Atkinson Hyperlegible",system-ui,sans-serif}.atkinson .t.new,.atkinson h2{font-weight:700}.atkinson .t.old{font-weight:400}
.jakarta{font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.outfit{font-family:"Outfit",system-ui,sans-serif}.outfit .b{font-weight:300}
.manrope{font-family:"Manrope",system-ui,sans-serif}
.dmsans{font-family:"DM Sans",system-ui,sans-serif}
.source{font-family:"Source Sans 3",system-ui,sans-serif}.source .t,.source .b{font-size:15.5px}
.work{font-family:"Work Sans",system-ui,sans-serif}
.poppins{font-family:"Poppins",system-ui,sans-serif}
</style>
<header>
  <h1>Notifications, in twelve fonts</h1>
  <p>Same calm layout in each. Pick the one that feels easiest and most relaxed to read on your phone.</p>
</header>
<div class="row" id="row"></div>
<script>
const items = [
  ['new', 'Your TPT result is ready', 'Your SKSU Tertiary Placement Test result is out. Open the app to see your scores and the programs you qualify for.', '43 minutes ago'],
  ['old', 'Enrolment briefing on Friday', 'Qualified applicants, please attend the enrolment briefing on Friday at 9:00 AM at your campus. Bring your result PDF and a valid ID.', 'Today, 2:07 AM'],
  ['old', 'Exam slot booked · your permit is ready', 'Sat, Oct 31 at Isulan Campus, Room 1, seat 2. Report by 7:30 AM; the exam starts at 8:00 AM.', 'Yesterday, 9:03 PM'],
];
const fonts = [
  ['lexend', 'Lexend (now)', 'Recommended: easiest to read, keeps the approved look.'],
  ['lexend-light', 'Lexend, lighter', 'Same font, softer weights.'],
  ['figtree', 'Figtree', 'Narrower and friendly.'],
  ['nunito', 'Nunito Sans', 'Rounder and soft.'],
  ['atkinson', 'Atkinson Hyperlegible', 'Made for low-vision readers; very clear letters.'],
  ['jakarta', 'Plus Jakarta Sans', 'Modern and open.'],
  ['outfit', 'Outfit', 'Light and airy, geometric.'],
  ['manrope', 'Manrope', 'Clean, slightly technical.'],
  ['dmsans', 'DM Sans', 'Simple and quiet.'],
  ['source', 'Source Sans 3', 'Plain and very readable for long text.'],
  ['work', 'Work Sans', 'Wide and friendly.'],
  ['poppins', 'Poppins', 'Round and popular; a bit heavy.'],
];
document.getElementById('row').innerHTML = fonts.map(([cls, name, note]) => `
<figure><figcaption><b>${name}</b><span>${note}</span></figcaption>
<div class="phone ${cls}"><div class="bar"><span class="seal" aria-hidden="true"></span><span><b>SKSU TPT</b><small>Tertiary Placement Test</small></span></div>
<div class="body"><span class="back">‹ Home</span><h2>Notifications</h2><ul>
${items.map(([s, t, b, at]) => `<li><span class="dot ${s === 'new' ? 'on' : ''}"></span><span><span class="t ${s}">${t}</span><span class="b">${b}</span><span class="at">${at}</span></span></li>`).join('')}
</ul></div></div></figure>`).join('');
</script>
