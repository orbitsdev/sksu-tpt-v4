<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";
const md = "# Tech plan\n\nWhat SKSU TPT v4 is built with, and why. Versions checked against the official docs on Oct 29, 2026; always start with the latest stable release. Every choice is made for TPT's own goals: **clean, fast, optimized**. Euphoria is only a reference; where its choice is also the best fit for TPT, we use it. Items marked **Decide** need your answer.\n\n## 1. The stack\n\n| Part | Choice | Why |\n|---|---|---|\n| Backend | **Laravel 13** (latest major, released Mar 17, 2026; security fixes until Mar 17, 2028), PHP 8.4 | Latest stable; supports PHP 8.3\u20138.5, and the TPT server already runs PHP 8.4. Built-in queue routing (Queue::route) fits the PDF and email queues |\n| Database | **MySQL 8** | Already on the server; tptv3 data can be read for reference |\n| Screens | **Inertia 3** (latest major, released Mar 26, 2026) **+ Vue 3 + TypeScript** | Pages load once, then only small JSON moves (fast on phones). Not Livewire: every click going back to the server is part of why tptv3 is slow |\n| Components | **shadcn-vue** (on Reka UI) **+ Tailwind 4** | **Decided.** We own every component, so the app ships only what it uses (small downloads on low-end phones and mobile data) and matches the calm SKSU design exactly. Accessible by default (Reka UI). Data tables with TanStack Table; date pickers, dialogs, drawers and sheets from the same set |\n| Student app | **PWA** (installable web app) | Install from the website on Android and iPhone; no APK, no store; offline permit |\n| Sign-in | **Google** (Laravel Socialite) | Same as tptv3; staff by invite only |\n| Roles | spatie/laravel-permission | Admin (+ super admin), Cashier, Proctor, Program chair / Dean (see 1b) |\n| Lists, filters, sorting | spatie/laravel-query-builder | One pattern for every list (tabs, search, filters, sort, 25 per page) |\n| Files (photos, receipts) | spatie/laravel-medialibrary | Photos shrunk on the phone first (about 200 KB) |\n| Excel import and export | A streaming reader/writer (e.g. OpenSpout) | Reads the Testing Center file as it is; big exports run in the background |\n| Result PDFs | **barryvdh/laravel-dompdf** | Light engine (no hidden browser); built before release by the queue |\n| Cache, sessions, queue | **Redis** | Takes load off MySQL on peak days; runs the PDF and message queues |\n| Queue monitor | Laravel Horizon | See jobs (PDFs, emails, imports), retry failed ones |\n| Email | tptv3 today: Gmail SMTP as sksutpt@gmail.com (about 500 emails a day). For v4: a mail service (e.g. Amazon SES, about $0.10 per 1,000) or the university's Google Workspace address (about 2,000 a day) | **Decide** (official sender); a plain Gmail can't email 9,000 students in one day |\n| SMS | tptv3 has **no SMS**. v4 starts with in-app + email; an SMS provider (e.g. Semaphore) can be added later | **Decide** later (budget) |\n\n## 1b. Packages (proven Laravel packages, so we don't rebuild what exists)\n\nEach one replaces code we would otherwise write and maintain. Check that every package supports Laravel 13 when the build starts.\n\n| Need in TPT | Package | Why this one |\n|---|---|---|\n| Roles: admin, super admin, cashier, proctor, program chair / dean | **spatie/laravel-permission** | The standard for roles and permissions; scoped by campus or program |\n| Photos, receipts, grades files, result PDFs | **spatie/laravel-medialibrary** | Stores files per applicant, makes small versions, keeps originals separate |\n| Activity log (every staff change, who and when, old and new value) | **spatie/laravel-activitylog** | Drop-in audit trail for the Activity logs page and record history |\n| Lists: search, filters, sorting, paging | **spatie/laravel-query-builder** | One safe pattern for every list's filters and sort from the address bar |\n| Settings (school year, payment methods, limits, maintenance switches) | **spatie/laravel-settings** | Typed settings stored in the database, changed on screen, no code edits |\n| Backups to off-server storage | **spatie/laravel-backup** | Daily database + files backup, keeps old copies, alerts on failure |\n| System status page (disk, queue, mail, database health) | **spatie/laravel-health** | Ready-made checks for the System status screen |\n| Excel import and export (Testing Center file, reports) | **spatie/simple-excel** (OpenSpout) | Streams big files row by row, low memory |\n| Result PDFs | **barryvdh/laravel-dompdf** | Light engine, runs in the queue |\n| QR codes (permit, result verify) | **simplesoftwareio/simple-qrcode** or endroid/qr-code | Small, no outside service |\n| Image resize on the server (safety net after phone shrinking) | **intervention/image** | Standard image library |\n| Google sign-in | **laravel/socialite** | Official |\n| Queue dashboard | **laravel/horizon** | Official; watch and retry PDFs, emails, imports |\n| Live performance monitor in production | **laravel/pulse** | Official; slow pages, busy queues, top users at a glance |\n| Typed links from Vue to Laravel routes | **laravel/wayfinder** | Official; no hand-written URLs in the screens |\n| Typed data between Laravel and Vue | **spatie/laravel-data** (+ TypeScript transformer) | One definition for each screen's data, checked on both sides |\n| Tests | **Pest** | Fast, readable tests for payments, examinee numbers, results |\n| Code quality | **Larastan** (static checks), **Laravel Pint** (formatting) | Catch mistakes before they ship |\n| Development only | **Laravel Telescope** or Debugbar | See queries and slow parts while building (never on the live server) |\n\nFront end: **shadcn-vue** + Tailwind 4, **TanStack Table** for big tables, **vite-plugin-pwa** for the installable student app, **browser-image-compression** to shrink photos on the phone before upload.\n\n## 2. How it fits together\n\n```mermaid\nflowchart LR\n    S[Student phone<br/>PWA] -->|small JSON| W[Laravel app]\n    A[Admin / cashier / chair<br/>browser] --> W\n    W --> DB[(MySQL)]\n    W --> R[(Redis<br/>cache, sessions)]\n    W --> Q[Queue<br/>Redis + Horizon]\n    Q --> P[Result PDFs<br/>1 worker, low priority]\n    Q --> M[Emails / SMS<br/>in waves]\n    Q --> X[Excel imports and exports]\n    P --> F[(File storage)]\n    X --> F\n```\n\n## 3. Built for the peak days\n\n- **Registration opening and results day** are the two busy moments (thousands at once).\n- Lists and the student's own data are cached; pages send small JSON, not whole pages.\n- Result PDFs are prepared **before** release; at release the server only hands out ready files.\n- Notices go out **in waves**; heavy work (imports, exports, PDFs, messages) runs in the queue.\n- Every action is rate-limited per student; support has its own limits.\n- **Load test** with 10,000 simulated students (k6) on a copy of the server before going live.\n\n## 3b. Best practices for speed (how we build every screen)\n\n**Server (Laravel 13)**\n- Only send what the screen shows: small props per page, never whole records or lists of thousands.\n- Database: indexes on every column we filter or sort by (status, schedule, campus, examinee no., OR no.); load related data together (no N+1 queries); lists paged 25 at a time.\n- Cache what many people read: programs, campuses, exam slots, a student's status and result summary (Redis), cleared when the data changes.\n- Heavy work always in the queue (PDFs, emails, Excel), with queue routing so PDFs never block emails; Horizon to watch it.\n- Production settings: config, routes, views and events cached; PHP OPcache on; logs rotated.\n- Rate limits per student and per action; one database transaction (with a lock) for payments and examinee numbers.\n\n**Screens (Inertia 3 + Vue 3)**\n- Each page loads only its own code (code splitting); the student app keeps its screens on the phone (PWA cache).\n- **Deferred props** for slow parts of a page (e.g. charts on the dashboard) so the page shows first.\n- **Infinite scroll / paging** for long lists; **polling only on screens that need it**, paused when the tab is in the background.\n- **Optimistic updates** for quick actions (e.g. marking a ticket solved), rolled back if the server says no.\n- **Prefetch** the next likely page (e.g. hovering a row) so it opens instantly.\n\n**Phone (PWA)**\n- App files cached on the phone; images small (photos shrunk before upload, about 200 KB); no heavy libraries; fonts kept to one family.\n- The permit and the student's own status work offline.\n\n**Check it**\n- Lighthouse score on a low-end Android profile before each release; a load test with 10,000 simulated students before go-live; Laravel's own performance tools during development.\n\n## 4. Server: the existing TPT server\n\nDecision: v4 runs on the **existing TPT server** (128.199.96.48), next to tptv3 until the switch.\n\n| | Plan |\n|---|---|\n| Now | 2 cores / 8 GB / 97 GB disk (44 GB free), PHP 8.4, MySQL 8, nginx. Ubuntu 20.04 |\n| Side by side | v4 gets its **own folder, database, nginx site and address** (e.g. a test subdomain). tptv3 keeps running untouched |\n| Add | Redis (cache, sessions, queue) and Supervisor for the queue workers (Horizon) |\n| Switch day | Point the real address to v4, keep tptv3 read-only for a while, then retire it |\n| Peak days | Resize to 4 cores for results day and registration opening, then back |\n| Before anything | **Snapshot the server**, fix the /root ownership problem (owned by the web user), set up off-server backups |\n| Ubuntu 20.04 | Out of standard support. Upgrade (20.04 \u2192 22.04 \u2192 24.04) in a quiet month, **after a snapshot**, or later move to a fresh 24.04 droplet |\n| Disk cleanup (after the switch) | tptv3's old uploads (about 40 GB) stay while tptv3 runs. After v4 is live: back them up off the server, shrink the oversized photos or archive old school years, delete only what the office agrees to. Expected: 40 GB down to a few GB |\n\n**The server is not touched until the app is finished.** Development and testing happen on the developer's machine (and a local test copy); the server prep (snapshot, /root fix, backups, Redis, v4 next to tptv3) is done only at go-live.\n\n## 5. Build order\n\n| Phase | What | Result |\n|---|---|---|\n| 1. Foundation | Project, sign-in, roles, school years, schedules, campuses, programs, rooms, exam slots | Admin can set up a school year |\n| 2. Apply | Student PWA: sign in, apply, photo, review, Home by status, support tickets | Students can apply |\n| 3. Pay | Cashier counter, OR checks, shifts, slip, examinee numbers | Payments recorded, numbers issued |\n| 4. Exam | Pick exam slot, permit (tptv3 layout, QR, offline), optional check-in | Permits out |\n| 5. Results | Excel import, approve, prepare PDFs (queue), release plan, survey, choose program | Results released safely |\n| 6. Reports and polish | Reports, office summary, maintenance, privacy, load test, go-live | Ready for the real school year |\n\nEach phase ends with a working, tested part, shown to you before the next starts.\n\n## 6. To decide\n\n1. **Server:** decided: the existing TPT server. When to set up the test site next to tptv3 (needs your go)?\n2. **Email sender:** the university address (admission@sksu.edu.ph?) and who sets up its mail access.\n3. **SMS:** start without SMS (email + in-app), or pick a provider and budget now?\n4. **Timeline:** when is the next school year's registration? That sets the go-live date.\n5. **Old data:** start fresh, or bring in tptv3's past applicants for reference only (read-only archive)?\n";
const doc = document.getElementById("doc");
doc.replaceChildren(...new DOMParser().parseFromString(DOMPurify.sanitize(marked.parse(md)), "text/html").body.childNodes);
doc.querySelectorAll("pre code.language-mermaid").forEach(c => { const d = document.createElement("div"); d.className = "mermaid"; d.textContent = c.textContent; c.parentElement.replaceWith(d); });
const toc = document.getElementById("toc");
doc.querySelectorAll("h2").forEach((h, i) => { h.id = "s" + i; const a = document.createElement("a"); a.href = "#s" + i; a.textContent = h.textContent; toc.appendChild(a); });
mermaid.initialize({ startOnLoad: false, theme: "neutral" });
await mermaid.run({ querySelector: ".mermaid" });
</script>
